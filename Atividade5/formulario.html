
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 5</title>
    <style>
        body{
            background-color: #130865;
            color: #f8f9f9;
            font-family: Arial, sans-serif;
        }
        h1, h2{
            text-align: center;
        }
        p{
            text-align: center;
        }
        form{
            max-width: 400px;
            margin: 0 auto;
            padding: 50px;
            border: 7px solid black;
            border-radius: 10px;
            background-color: #006485;
        }
        label{
            display: block;
            margin-bottom: 5px;
        }
        input[type="text"], input[type="email"], input[type="password"]{
            width: 100%;
            padding: 8px;
            margin-bottom: 25px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        input[type="date"]{
            width: 95%;
            padding: 12px;
            font-size: 16px;
            accent-color: #d51313;
            border: 2px solid #f8f3f3;
            border-radius: 4px;
        }
        input[type="radio"]{
            accent-color: #00ff99;
        }
        .sexo{
            text-align: center;
        }
        .sexo label{
            display: inline-block;
            margin-right: 10px;
        }
        input[type="submit"]{
            background-color: #00ff99;
            color: #000000;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        input[type="submit"]:hover{
            background-color: #e0e0e0;
        }
    </style>
</head>
<body>
    <h1>Formulário de Cadastro</h1>

    <form action="processar.php" method="post">

        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" required><br><br>

        <h2>Definições: </h2>

        <p>Data de nascimento: </p>
        <input type="date" id="data" name="data" required><br><br>

        <p>Curso: </p>
        <input type="text" id="curso" name="curso" required><br><br>

        <p>Sexo: </p>
        <div class="sexo">
            <input type="radio" id="masculino" name="sexo" value="Masculino" required>
            <label for="masculino">Masculino</label>

            <input type="radio" id="feminino" name="sexo" value="Feminino">
            <label for="feminino">Feminino</label>

            <input type="radio" id="outro" name="sexo" value="Outro">
            <label for="outro">Outro</label>
        </div>
        <br><br>

        <p>Interesses: </p>
        <input type="text" id="Interesses" name="interesses">

        <p>Comentários: </p>
        <textarea id="comentarios" name="comentarios" rows="4" cols="50"></textarea><br><br>

        <p>Foto do aluno:</p>
        <input type="file" id="foto" name="foto" accept="image/*"><br><br>

        <input type="submit" value="Cadastrar">
    </form>
</body>
</html>
